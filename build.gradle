// Top-level build file where you can add configuration options common to all sub-projects/modules.

subprojects {
    apply plugin: 'java'
    apply plugin: 'application'
    
    group = 'org.example'
    version = '1.0-SNAPSHOT'
    
    repositories {
        mavenCentral()
    }
    
    dependencies {
        // Common dependencies for all subprojects can go here
    }
}

// Application specific configuration
project(':app') {
    dependencies {
        implementation platform('io.dropwizard:dropwizard-bom:5.0.0')
        implementation 'io.dropwizard:dropwizard-core'
        implementation 'io.dropwizard:dropwizard-client'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
        
        // Jakarta EE 10 dependencies
        implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
        implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.3'
        
        testImplementation 'io.dropwizard:dropwizard-testing'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.1'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.12.1'
    }
    
    application {
        mainClass = 'org.example.app.App'
    }
    
    run {
        args = ['server']
    }
    
    test {
        useJUnitPlatform()
    }
}
